stop_installation:
  name: Stop installation
  description: >-
    Stops an entire MySair installation (all its zones at once) using the
    backend's "stop" command. Different from turning off each zone
    individually with a switch or climate entity.
  fields:
    installation_ref:
      name: Installation reference
      description: >-
        Reference (ctl) of the installation to stop, starting with "MYS".
        It is listed in the integration's diagnostics download.
      required: true
      example: "MYS000000000000000"
      selector:
        text:
