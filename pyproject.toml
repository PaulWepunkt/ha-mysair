[tool.ruff]
# Lowest Python version the pure modules must stay valid for. CI and Docker
# run 3.14 (required by the Home Assistant test harness).
target-version = "py39"

[tool.ruff.lint]
# Default rule set (E4, E7, E9, F) only. Deliberate: stricter categories
# (I, UP, B, SIM, ...) are not enabled yet - doing so without triaging the
# findings first would mix "enable ruff" with "an unreviewed wave of cleanup"
# (see docs/execution-plan.md, task 30). Extending the rule set is a possible
# separate task.
